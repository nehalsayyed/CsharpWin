name: Generate Blank Expo Zip Artifact

on:
  workflow_dispatch:

jobs:
  generate-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Blank Expo App
        run: |
          TEMP_DIR=$(mktemp -d)
          npx --yes create-expo-app@latest $TEMP_DIR/my-app --template blank --no-install
          cd $TEMP_DIR/my-app
          zip -r $GITHUB_WORKSPACE/expo-project.zip .

      - name: Upload Project Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-project
          path: expo-project.zip
          
