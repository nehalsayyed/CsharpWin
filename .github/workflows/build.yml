name: Build Termux Native JUCE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # Fast native ARM64 runner
    container:
      image: ghcr.io/termux/docker:latest-aarch64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Termux Environment & Dependencies
        run: |
          pkg update -y
          pkg install -y \
            clang \
            cmake \
            ninja \
            git \
            make \
            freetype \
            fontconfig \
            libx11 \
            libxext \
            libxrandr \
            libxinerama \
            libxcursor \
            mesa \
            openal-soft

      - name: Build JUCE Engine & Examples
        run: |
          git clone --depth 1 https://github.com/juce-framework/JUCE.git
          cd JUCE
          
          # Build core JUCE framework with Ninja
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

          # Build Audio App / Plugin Examples
          cmake -B examples/build -S examples -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/build --parallel $(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juce-termux-arm64-binaries
          path: |
            JUCE/examples/build/
            JUCE/build
            
