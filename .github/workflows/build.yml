name: Build Aider ARM64 Wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # Fast native ARM64 runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 3.11 has full binary wheel compatibility

      - name: Build Wheel bundle
        run: |
          python -m pip install --upgrade pip wheel
          mkdir -p dist
          pip wheel aider-chat -w dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aider-arm64-wheels
          path: dist/*.whl
          
