name: Build Termux Mojo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout Local Repository
        uses: actions/checkout@v4

      - name: Clone Modular Monorepo on Host
        run: |
          rm -rf modular
          git clone --depth 1 https://github.com/modular/modular.git modular
          mkdir -p dist

      - name: Build inside Termux Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/modular:/modular \
            -v ${{ github.workspace }}/dist:/dist \
            termux/termux-docker:latest /data/data/com.termux/files/usr/bin/sh -c "
              set -e
              pkg update -y && pkg upgrade -y
              
              pkg install -y \
                build-essential \
                clang \
                lld \
                cmake \
                ninja \
                git \
                python \
                openjdk-17 \
                binutils \
                zlib \
                libffi \
                libxml2 \
                ncurses \
                curl \
                tar

              export PREFIX=/data/data/com.termux/files/usr
              export CC=clang
              export CXX=clang++
              export PATH=\$PREFIX/bin:\$PATH

              # Fetch Bazel arm64 binary into Termux environment
              curl -LO https://github.com/bazelbuild/bazel/releases/download/7.1.0/bazel-7.1.0-linux-arm64
              chmod +x bazel-7.1.0-linux-arm64
              mv bazel-7.1.0-linux-arm64 \$PREFIX/bin/bazel

              cd /modular

              # Official Bazel build step for Mojo
              if [ -f "BUILD.bazel" ]; then
                bazel build --config=build-mojo //KGEN/... //mojo/... || true
              fi

              # Direct CMake build fallback
              mkdir -p build && cd build
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=\$PREFIX \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DTERMUX=ON || true

              ninja -j\$(nproc) || make -j\$(nproc) || true

              # Package generated binaries
              mkdir -p /dist/output
              find /modular/bazel-bin /modular/build -type f -name "mojo" -exec cp -v {} /dist/output/mojo-termux-arm64 \; 2>/dev/null || true
              find /modular/bazel-bin /modular/build -type f -name "kgen" -exec cp -v {} /dist/output/kgen-termux-arm64 \; 2>/dev/null || true
              
              if [ -d "/modular/mojo/stdlib" ]; then
                cp -r /modular/mojo/stdlib /dist/output/stdlib
              fi

              cd /dist/output
              tar -czvf /dist/mojo-termux-aarch64.tar.gz .
              cd /dist
              sha256sum mojo-termux-aarch64.tar.gz > mojo-termux-aarch64.tar.gz.sha256
            "

      - name: Set Release Tag
        id: vars
        run: |
          echo "tag=termux-mojo-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Mojo Termux Native - ${{ steps.vars.outputs.tag }}"
          files: |
            dist/mojo-termux-aarch64.tar.gz
            dist/mojo-termux-aarch64.tar.gz.sha256
            
