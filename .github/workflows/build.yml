name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo (required for Flutter tooling)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Required by modern Flutter/Gradle)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Create App, copy main.dart from repo, and build minified APK
      - name: Create & Build Flutter App
        run: |
          flutter doctor
          flutter create nehalapp
          
          # Copy main.dart from repository root to the generated project
          cp ./main.dart nehalapp/lib/main.dart
          
          cd nehalapp
          flutter pub get
          flutter pub add cpu_info_plus
          
          # Build highly optimized, arm64-v8a specific APK
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      # Step 5: Upload the generated APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nehalapp-arm64-release
          path: nehalapp/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          
