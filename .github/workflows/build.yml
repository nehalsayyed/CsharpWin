name: Build CompCert ARM64 for Termux PRoot

on:
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm # Native ARM64 GitHub Runner

    steps:
      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc \
            ocaml \
            ocaml-findlib \
            coq \
            menhir \
            libmenhir-ocaml-dev

      - name: Manually Clone CompCert Repository
        run: |
          git clone https://github.com/AbsInt/CompCert.git compcert_src
          
      - name: Configure CompCert
        run: |
          cd compcert_src
          # Target 64-bit ARM Linux (matches Termux proot-distro aarch64)
          ./configure aarch64-linux -clightgen

      - name: Build CompCert
        run: |
          cd compcert_src
          make -j$(nproc)

      - name: Package Binaries for Termux
        run: |
          cd compcert_src
          # Create compressed tarball of binaries, libraries, and runtime headers
          tar -czvf ../compcert-ubuntu-arm64.tar.gz ccomp clightgen runtime/ lib/ share/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compcert-ubuntu-arm64
          path: compcert-ubuntu-arm64.tar.gz
          retention-days: 7
          
