name: Build J2ME APK-Ready JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # Step 3: Download MIDP/CLDC stub library for compilation
      - name: Download J2ME Stub Libraries
        run: |
          mkdir -p lib
          # Fetch MIDP 2.0 / CLDC 1.1 stub library JAR
          curl -sSL -o lib/midpapi20.jar "https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar"

      # Step 4: Compile source code referencing the J2ME library
      - name: Compile MIDlet
        run: |
          mkdir -p build/classes
          javac -Xlint:-options -source 1.3 -target 1.3 -cp "lib/midpapi20.jar:src" -d build/classes src/HelloMIDlet.java

      # Step 5: Generate Manifest with J2ME Attributes
      - name: Generate J2ME Manifest
        run: |
          mkdir -p build/META-INF
          cat << 'EOF' > build/META-INF/MANIFEST.MF
          Manifest-Version: 1.0
          MIDlet-Name: HelloMIDlet
          MIDlet-Version: 1.0.0
          MIDlet-Vendor: MyCompany
          MIDlet-1: HelloMIDlet, , HelloMIDlet
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          EOF

      # Step 6: Package into a Single Standalone JAR File
      - name: Package Single JAR
        run: |
          mkdir -p build/out
          jar cvfm build/out/HelloMIDlet.jar build/META-INF/MANIFEST.MF -C build/classes .
          
          if [ -d "res" ] && [ "$(ls -A res)" ]; then
            jar uvf build/out/HelloMIDlet.jar -C res .
          fi

      # Step 7: Upload Single Standalone JAR
      - name: Upload Single JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloMIDlet-standalone
          path: build/out/HelloMIDlet.jar
          
