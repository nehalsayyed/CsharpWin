name: Build J2ME APK-Ready JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 8 (for Java 1.3 / CLDC compatibility)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # Step 3: Compile source code into Java ME compatible classes
      - name: Compile MIDlet
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 -cp src -d build/classes src/HelloMIDlet.java

      # Step 4: Generate Manifest with J2ME Attributes
      - name: Generate J2ME Manifest
        run: |
          mkdir -p build/META-INF
          cat << 'EOF' > build/META-INF/MANIFEST.MF
          Manifest-Version: 1.0
          MIDlet-Name: HelloMIDlet
          MIDlet-Version: 1.0.0
          MIDlet-Vendor: MyCompany
          MIDlet-1: HelloMIDlet, , HelloMIDlet
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          EOF

      # Step 5: Package into a Single Self-Contained JAR File
      - name: Package Single JAR
        run: |
          mkdir -p build/out
          # Create JAR with custom Manifest
          jar cvfm build/out/HelloMIDlet.jar build/META-INF/MANIFEST.MF -C build/classes .
          
          # Include res contents if the folder exists and is not empty
          if [ -d "res" ] && [ "$(ls -A res)" ]; then
            jar uvf build/out/HelloMIDlet.jar -C res .
          fi

      # Step 6: Upload Single Standalone JAR
      - name: Upload Single JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloMIDlet-standalone
          path: build/out/HelloMIDlet.jar
          
