name: Build CompCert ARM64 for Termux PRoot

on:
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm # Native ARM64 GitHub Runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            ocaml \
            ocaml-findlib \
            coq \
            menhir \
            libmenhir-ocaml-dev

      - name: Configure CompCert
        run: |
          # Target 64-bit ARM Linux (matches Termux proot-distro aarch64)
          ./configure arm64-linux -clightgen

      - name: Build CompCert
        run: |
          make -j$(nproc)

      - name: Package Binaries
        run: |
          # Package executables, internal libraries, and headers
          tar -czvf compcert-ubuntu-arm64.tar.gz ccomp clightgen runtime/ lib/ share/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compcert-ubuntu-arm64
          path: compcert-ubuntu-arm64.tar.gz
          retention-days: 7
          
