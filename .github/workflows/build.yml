name: Build Compose Termux Rootfs

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-24.04-arm  # Fast native ARM64 runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y debootstrap qemu-user-static xz-utils wget unzip

      - name: Bootstrap Minimal Debian ARM64 Rootfs
        run: |
          sudo debootstrap --arch=arm64 bookworm ./rootfs http://deb.debian.org/debian

      - name: Configure Rootfs & Set Up Android SDK + Native AAPT2
        run: |
          # Setup DNS resolution inside chroot
          sudo cp /etc/resolv.conf ./rootfs/etc/resolv.conf

          # Mount pseudo-filesystems
          sudo mount -t proc /proc ./rootfs/proc
          sudo mount -t sysfs /sys ./rootfs/sys
          sudo mount --bind /dev ./rootfs/dev

          # Execute in chroot with clean environment (prevents host JAVA_HOME leakage)
          sudo env -i HOME=/root PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            chroot ./rootfs /bin/bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt update -y
            apt install -y --no-install-recommends \
              openjdk-17-jdk-headless \
              aapt \
              wget \
              unzip \
              git \
              ca-certificates \
              curl

            # Determine Java path accurately
            JAVA_PATH=\$(readlink -f /usr/bin/java | sed 's:/bin/java::')
            export JAVA_HOME=\$JAVA_PATH
            export ANDROID_HOME=/opt/android-sdk

            # 1. Download Command Line Tools into temp folder
            mkdir -p /opt/android-sdk/temp-tools
            cd /opt/android-sdk/temp-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-*.zip
            
            # 2. Re-structure correctly to /opt/android-sdk/cmdline-tools/latest
            mkdir -p /opt/android-sdk/cmdline-tools/latest
            mv cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
            cd /opt/android-sdk
            rm -rf temp-tools

            # Update PATH for sdkmanager execution
            export PATH=\$PATH:\$ANDROID_HOME/cmdline-tools/latest/bin:\$ANDROID_HOME/platform-tools

            # 3. Accept Licenses & Install Platforms + Build-Tools
            yes | sdkmanager --licenses
            sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

            # 4. Remove Google's x86 AAPT2 and link native ARM64 version
            rm -f /opt/android-sdk/build-tools/34.0.0/aapt2
            ln -sf /usr/bin/aapt2 /opt/android-sdk/build-tools/34.0.0/aapt2

            # 5. Persist Environment Variables for PRoot Logins
            echo \"export ANDROID_HOME=/opt/android-sdk\" >> /root/.bashrc
            echo \"export JAVA_HOME=\$JAVA_PATH\" >> /root/.bashrc
            echo \"export PATH=\\\$PATH:\$ANDROID_HOME/cmdline-tools/latest/bin:\$ANDROID_HOME/platform-tools:\$ANDROID_HOME/build-tools/34.0.0:\$JAVA_PATH/bin\" >> /root/.bashrc

            # 6. Clean unused SDK components & apt cache
            rm -rf /opt/android-sdk/emulator
            rm -rf /opt/android-sdk/system-images
            apt clean
            rm -rf /var/lib/apt/lists/*
          "

          # Unmount pseudo-filesystems safely
          sudo umount -lf ./rootfs/proc || true
          sudo umount -lf ./rootfs/sys || true
          sudo umount -lf ./rootfs/dev || true

      - name: Package Rootfs Tarball
        run: |
          cd rootfs
          sudo tar -cJpf ../termux-compose-rootfs.tar.xz .

      - name: Upload Rootfs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-compose-rootfs
          path: termux-compose-rootfs.tar.xz
