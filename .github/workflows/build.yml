name: Build Termux Native JUCE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build JUCE inside Docker Hub Termux Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            termux/termux-docker:aarch64 \
            sh -c "
              pkg update -y && \
              pkg install -y \
                clang \
                cmake \
                ninja \
                git \
                make \
                freetype \
                fontconfig \
                libx11 \
                libxext \
                libxrandr \
                libxcursor \
                libxrender \
                libxi \
                mesa \
                openal-soft \
                libcurl \
                ladspa && \

              # Clone JUCE
              git clone --depth 1 https://github.com/juce-framework/JUCE.git && \

              # Build and install core JUCE (Headers & CMake modules)
              cmake -B JUCE/build -S JUCE -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DJUCE_BUILD_EXAMPLES=ON \
                -DCMAKE_INSTALL_PREFIX=/workspace/juce_installed && \
              cmake --build JUCE/build --target install --parallel \$(nproc) && \

              # Build JUCE Example Binaries
              cmake -B JUCE/examples/build -S JUCE/examples -G Ninja \
                -DCMAKE_BUILD_TYPE=Release && \
              cmake --build JUCE/examples/build --parallel \$(nproc)
            "

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juce-termux-binaries
          path: JUCE/examples/build/

      - name: Upload Header Libraries & CMake Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juce-termux-installed-headers
          path: juce_installed/
          
