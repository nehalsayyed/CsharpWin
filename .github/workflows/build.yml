name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo (required for Flutter tooling)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Required by modern Flutter/Gradle)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Create App, write code, and build minified APK
      - name: Create & Build Flutter App
        run: |
          flutter doctor
          flutter create nehalapp
          cd nehalapp
          
          # Write main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Flutter UI Demo',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple),
                  useMaterial3: true,
                ),
                home: const MainScreen(),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            int _selectedIndex = 0;

            final List<Widget> _pages = const [
              Center(child: Text('Home Screen', style: TextStyle(fontSize: 22))),
              Center(child: Text('Search Screen', style: TextStyle(fontSize: 22))),
              Center(child: Text('Profile Screen', style: TextStyle(fontSize: 22))),
            ];

            void _showBottomSheet(BuildContext context) {
              showModalBottomSheet(
                context: context,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (context) => Container(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Container(
                        width: 40,
                        height: 5,
                        decoration: BoxDecoration(
                          color: Colors.grey[300],
                          borderRadius: BorderRadius.circular(10),
                        ),
                      ),
                      const SizedBox(height: 20),
                      const Text(
                        'Bottom Sheet Menu',
                        style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 16),
                      ListTile(
                        leading: const Icon(Icons.share),
                        title: const Text('Share App'),
                        onTap: () => Navigator.pop(context),
                      ),
                      ListTile(
                        leading: const Icon(Icons.download),
                        title: const Text('Download Content'),
                        onTap: () => Navigator.pop(context),
                      ),
                      ListTile(
                        leading: const Icon(Icons.delete, color: Colors.red),
                        title: const Text('Remove Item', style: TextStyle(color: Colors.red)),
                        onTap: () => Navigator.pop(context),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('UI Components Demo'),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.info_outline),
                      onPressed: () => _showBottomSheet(context),
                    )
                  ],
                ),
                
                // --- 1. SIDE DRAWER MENU ---
                drawer: Drawer(
                  child: ListView(
                    padding: EdgeInsets.zero,
                    children: [
                      const DrawerHeader(
                        decoration: BoxDecoration(color: Colors.deepPurple),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          mainAxisAlignment: MainAxisAlignment.end,
                          children: [
                            CircleAvatar(
                              radius: 28,
                              backgroundColor: Colors.white,
                              child: Icon(Icons.person, size: 36, color: Colors.deepPurple),
                            ),
                            SizedBox(height: 8),
                            Text('User Account', style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                            Text('user@example.com', style: TextStyle(color: Colors.white70, fontSize: 12)),
                          ],
                        ),
                      ),
                      ListTile(
                        leading: const Icon(Icons.dashboard),
                        title: const Text('Dashboard'),
                        onTap: () => Navigator.pop(context),
                      ),
                      ListTile(
                        leading: const Icon(Icons.settings),
                        title: const Text('Settings'),
                        onTap: () => Navigator.pop(context),
                      ),
                      const Divider(),
                      ListTile(
                        leading: const Icon(Icons.logout, color: Colors.red),
                        title: const Text('Logout', style: TextStyle(color: Colors.red)),
                        onTap: () => Navigator.pop(context),
                      ),
                    ],
                  ),
                ),

                // --- 2. BODY PAGE VIEWS ---
                body: _pages[_selectedIndex],

                // Floating Action Button to launch Bottom Sheet directly
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: () => _showBottomSheet(context),
                  icon: const Icon(Icons.layers),
                  label: const Text('Open Sheet'),
                ),

                // --- 3. BOTTOM NAVIGATION BAR ---
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _selectedIndex,
                  onDestinationSelected: (int index) {
                    setState(() {
                      _selectedIndex = index;
                    });
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Home',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.search_outlined),
                      selectedIcon: Icon(Icons.search),
                      label: 'Search',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.person_outline),
                      selectedIcon: Icon(Icons.person),
                      label: 'Profile',
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          flutter pub get
          
          # Build highly optimized, arm64-v8a specific APK
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      # Step 5: Upload the generated APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nehalapp-arm64-release
          path: nehalapp/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          
