name: Build React Native ARM64 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create App in Temp Directory and Build
        run: |
          # 1. Create temporary directory outside the runner root
          TEMP_DIR=$(mktemp -d)
          cd $TEMP_DIR

          # 2. Initialize fresh React Native app with no interactive prompts
          npx --yes @react-native-community/cli@latest init CsharpWin --skip-install --pm npm

          cd CsharpWin

          # 3. Add Vision Camera dependency cleanly
          npm install react-native-vision-camera@^4.0.0 --save

          # 4. Restrict build target strictly to arm64-v8a architecture to optimize size
          echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties

          # 5. Build small ARM64 Release APK
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

          # 6. Copy output APK back to runner workspace for artifact upload
          mkdir -p $GITHUB_WORKSPACE/output
          cp app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/output/app-arm64-v8a-release.apk

      - name: Upload Small ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-arm64-apk
          path: output/app-arm64-v8a-release.apk
          
