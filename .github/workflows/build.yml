name: Build Aider ARM64 Wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # Fast native ARM64 runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      
      - name: Build Juce
        run: |
          sudo apt update -y
          sudo apt install -y libasound2-dev libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev  \
          libfreetype-dev libfontconfig1-dev \
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
          libwebkit2gtk-4.1-dev \
          libglu1-mesa-dev mesa-common-dev libegl-dev

          git clone https://github.com/juce-framework/JUCE.git
          cd JUCE
          mkdir build
          cd build
          cmake ..
          make -j $(nproc)
          cd ..
          cd examples
          mkdir build
          cd build
          cmake ..
          make -j $(nproc)
          

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aider-arm64-wheels
          path: dist/*.whl
          
