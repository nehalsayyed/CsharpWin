name: Build hermes-decomp ARM64 Executable

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-arm64-binary:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build hermes-decomp Binary
        run: |
          git clone https://github.com/SymbioticSec/hermes-decomp.git
          cd hermes-decomp
          cargo build --release --bin hermes-decomp

      - name: Verify Binary Info
        run: |
          chmod +x hermes-decomp/target/release/hermes-decomp
          file hermes-decomp/target/release/hermes-decomp

      - name: Upload Single Binary Executable
        uses: actions/upload-artifact@v4
        with:
          name: hermes-decomp-arm64
          path: hermes-decomp/target/release/hermes-decomp
          
