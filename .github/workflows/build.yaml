name: Build

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Explicitly clone the specific external repository
      - name: Running 
        run: |
         sudo apt install gnat -y
         git clone https://github.com/tsoding/eepers.git
         cd eepers
         chmod 777 build-linux.sh
         ./build-linux.sh
