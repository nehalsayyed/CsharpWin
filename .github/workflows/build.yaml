name: Build 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout host repository
        uses: actions/checkout@v4

      - name: Install LLVM, Clang, LLD, and Build Tools
        run: |
          git clone https://github.com/nikita36078/J2ME-Loader.git
          cd J2ME-Loader
          chmod 777 gradlew 
          ./gradlew assembleDebug 
