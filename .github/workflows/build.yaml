name: Build GraalVM Native Android/Linux Binary

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  

jobs:
  build-native-binary:
    # Use native ARM64 runner for fast, native aarch64 compilation
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      # Step 1: Initialize a new example Java application if one doesn't exist
      - name: Init Example Java Project
        run: |
          mkdir -p src/com/example
          cat << 'EOF' > src/com/example/Main.java
          package com.example;

          public class Main {
              public static void main(String[] args) {
                  System.out.println("==========================================");
                  System.out.println(" Hello from GraalVM Native Binary on Termux!");
                  System.out.println(" Architecture: " + System.getProperty("os.arch"));
                  System.out.println(" Java Version: " + System.getProperty("java.version"));
                  System.out.println("==========================================");
              }
          }
          EOF

      # Step 2: Compile Java source files to bytecode
      - name: Compile Java Code
        run: |
          mkdir -p bin
          javac -d bin src/com/example/Main.java

      # Step 3: Ahead-Of-Time (AOT) compile bytecode into a native binary using GraalVM
      - name: Build Standalone Native Executable
        run: |
          native-image \
            -cp bin \
            --no-fallback \
            -H:Name=app-aarch64 \
            com.example.Main

      # Step 4: Verify and make executable
      - name: Test Native Executable Execution & Check Binary Info
        run: |
          chmod +x app-aarch64
          ./app-aarch64
          file app-aarch64

      # Step 5: Upload the compiled binary as a workflow artifact
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-aarch64
          path: app-aarch64
          
