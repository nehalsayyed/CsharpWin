name: Build hermes-dec ARM64 Executable

on:
  workflow_dispatch:

jobs:
  build-hermes-dec:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Build hermes-dec for ARM64
        run: |
          git clone --recursive https://github.com/P1sec/hermes-dec.git
          cd hermes-dec
          mkdir build && cd build
          cmake ..
          make -j$(nproc)

      - name: Verify Binary
        run: |
          chmod +x hermes-dec/build/hermes-dec
          file hermes-dec/build/hermes-dec

      - name: Upload Single Binary Executable
        uses: actions/upload-artifact@v4
        with:
          name: hermes-dec
          path: hermes-dec/build/hermes-dec
          
