name: Init Lynx JS App & Build APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. Set up Java JDK required for Android Gradle
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Initialize a brand new Lynx JS project non-interactively
      - name: Initialize Lynx JS Project
        run: |
          npm create lynx@latest my-lynx-app -- --template default
          cd my-lynx-app
          npm install

      # 4. Build Lynx JS Assets
      - name: Build Lynx JS Assets
        run: |
          cd my-lynx-app
          npm run build

      # 5. Make Gradlew executable
      - name: Make Gradlew Executable
        run: chmod +x my-lynx-app/android/gradlew

      # 6. Build Android Debug APK
      - name: Build Android APK
        run: |
          cd my-lynx-app/android
          ./gradlew assembleDebug --no-daemon

      # 7. Upload the compiled APK as an artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynx-debug-apk
          path: my-lynx-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
