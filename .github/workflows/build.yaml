name: Build Legacy Android MVP Sample

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the project repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java 8 (Required for Gradle 4.1 & AGP 3.0.1)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      # 3. Patch root build.gradle to replace dead jcenter() with mavenCentral() & google()
      - name: Patch Repositories in root build.gradle
        run: |
          sed -i 's/jcenter()/google()\n        mavenCentral()/g' build.gradle

      # 4. Patch app/build.gradle to ensure Google and Maven Central resolution
      - name: Patch Repositories in app build.gradle
        run: |
          if [ -f app/build.gradle ]; then
            sed -i 's/jcenter()/google()\n        mavenCentral()/g' app/build.gradle
          fi

      # 5. Make Gradle wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Build Debug APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 7. Upload the compiled APK as an artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
