name: Build Tauri v2 Android APK

on:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Setup Java JDK (Required for Android Gradle build)
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Android SDK & NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      # 4. Setup Rust Toolchain and Android Targets
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      # 5. Initialize Tauri v2 App from Scratch
      - name: Create Tauri v2 App
        run: |
          npm create tauri-app@latest my-tauri-app -- --template react-ts --yes
          cd my-tauri-app
          npm install

      # 6. Initialize Tauri Android Native Project
      - name: Initialize Tauri Android Project
        run: |
          cd my-tauri-app
          npx tauri android init --target aarch64

      # 7. Build Android Debug APK
      - name: Build Android APK
        run: |
          cd my-tauri-app
          npx tauri android build --apk --target aarch64

      # 8. Upload Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-apk
          path: my-tauri-app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          retention-days: 7
          
