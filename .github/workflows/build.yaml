name: Rust Kani Verification

on:
  workflow_dispatch:

jobs:
  verify-rust:
    name: Run Kani Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Create Inline Rust Project
        run: |
          mkdir -p rust_demo/src
          cat << 'EOF' > rust_demo/Cargo.toml
          [package]
          name = "rust_demo"
          version = "0.1.0"
          edition = "2021"
          EOF

          cat << 'EOF' > rust_demo/src/main.rs
          fn add(a: u32, b: u32) -> u32 {
              a + b
          }

          #[cfg(kani)]
          #[kani::proof]
          fn check_add_no_overflow() {
              let a: u32 = kani::any();
              let b: u32 = kani::any();
              
              kani::assume(a < 1000);
              kani::assume(b < 1000);
              
              let result = add(a, b);
              assert!(result >= a);
          }

          fn main() {
              println!("Rust project created successfully.");
          }
          EOF

      - name: Run Kani Verification
        working-directory: ./rust_demo
        run: cargo kani
        
