name: Build Expo Inline Module APK

on:
  workflow_dispatch:

env:
  CI: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Setup Java JDK
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Initialize Expo Project
      - name: Create New Expo App
        run: |
          npx create-expo-app@latest my-expo-app --template blank --yes
          cd my-expo-app
          npm install

      # 5. Configure app.json (Set Package Name & Enable Inline Modules)
      - name: Configure App and Native Code
        run: |
          cd my-expo-app

          node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            
            // Set unique Android package name to avoid Play Store prompt
            appJson.expo.android = appJson.expo.android || {};
            appJson.expo.android.package = "com.mycompany.inlineapp";
            
            // Enable inline modules watching "native" folder
            appJson.expo.experiments = { inlineModules: { watchedDirectories: ["native"] } };
            
            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2));
          '

          mkdir -p native

          # Create Kotlin Native Inline Module
          cat << 'EOF' > native/MyNativeModule.kt
          package native

          import expo.modules.kotlin.modules.Module
          import expo.modules.kotlin.modules.ModuleDefinition

          class MyNativeModule : Module() {
              override fun definition() = ModuleDefinition {
                  Name("MyNativeModule")
                  Function("getNativeMessage") {
                      "Hello from Kotlin Native Inline Module!"
                  }
              }
          }
          EOF

          # Root App.js calling the inline module
          cat << 'EOF' > App.js
          import React from 'react';
          import { StyleSheet, Text, View } from 'react-native';
          import { requireNativeModule } from 'expo';

          const MyNativeModule = requireNativeModule('MyNativeModule');

          export default function App() {
            return (
              <View style={styles.container}>
                <Text style={styles.text}>{MyNativeModule.getNativeMessage()}</Text>
              </View>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, backgroundColor: '#fff', alignItems: 'center', justifyContent: 'center' },
            text: { fontSize: 18, fontWeight: 'bold', color: '#333' }
          });
          EOF

      # 6. Generate Native Android Code (CI=true environment forces headless prebuild)
      - name: Run Expo Prebuild
        run: |
          cd my-expo-app
          npx expo prebuild --platform android --clean

      # 7. Make Gradlew Executable
      - name: Grant Executable Permissions
        run: chmod +x my-expo-app/android/gradlew

      # 8. Build Debug APK
      - name: Build Debug APK
        run: |
          cd my-expo-app/android
          ./gradlew assembleDebug --no-daemon

      # 9. Upload Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-inline-module-debug-apk
          path: my-expo-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          
