name: Build SFML 3 for Termux (Android aarch64)

on:
  workflow_dispatch:

jobs:
  build-sfml:
    name: Cross-Compile SFML for Termux
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Build Tools
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git zip

      # 3. Clone SFML 3
      - name: Clone SFML
        run: |
          git clone --depth 1 https://github.com/SFML/SFML.git sfml-src

      # 4. Configure CMake
      - name: Configure CMake
        run: |
          mkdir sfml-build
          cd sfml-build
          cmake ../sfml-src \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_TEST_SUITE=OFF

      # 5. Compile SFML Libraries
      - name: Build SFML
        run: |
          cd sfml-build
          ninja

      # 6. Package Compiled Libraries and Headers
      - name: Package SFML Libraries
        run: |
          mkdir -p sfml-termux/lib sfml-termux/include
          
          # Copy compiled shared libraries (.so files)
          cp sfml-build/lib/*.so sfml-termux/lib/
          
          # Copy STL libc++_shared.so from NDK
          cp $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so sfml-termux/lib/
          
          # Copy C++ Include Headers
          cp -r sfml-src/include/SFML sfml-termux/include/
          
          # Create ZIP file
          cd sfml-termux
          zip -r ../sfml-android-aarch64-termux.zip .

      # 7. Upload Artifact
      - name: Upload SFML Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfml-android-aarch64-termux
          path: sfml-android-aarch64-termux.zip
          retention-days: 7
          
