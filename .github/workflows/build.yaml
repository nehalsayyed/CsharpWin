name: Get System Information

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  gather-specs:
    # Uses GitHub's free-tier Ubuntu runner 
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch CPU Information
        run: |
          echo "=== CPU Info ==="
          lscpu | grep -E "Model name|Core\(s\) per socket|Socket\(s\)|Thread\(s\) per core|CPU\(s\):"

      - name: Fetch Memory Information
        run: |
          echo "=== Memory Info ==="
          free -h

      - name: Fetch Operating System & Kernel Info
        run: |
          echo "=== OS & Kernel Info ==="
          uname -a
          cat /etc/os-release | grep -E "PRETTY_NAME|VERSION="

      - name: Fetch Disk Space Information
        run: |
          echo "=== Disk Info ==="
          df -h /
          
