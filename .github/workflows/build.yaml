name: Build Lynx Web Bundle

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Lynx Bundle for Web
    runs-on: ubuntu-latest

    steps:
      # 1. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Initialize Lynx JS / Rspeedy App
      - name: Create Lynx App
        run: |
          npm create rspeedy@latest my-lynx-app -- --template react --yes
          cd my-lynx-app
          npm install

      # 3. Compile Lynx Bundle Files
      - name: Build Web Production Assets
        run: |
          cd my-lynx-app
          npm run build

      # 4. Upload Dist Bundle as Artifact
      - name: Upload Web Bundle
        uses: actions/upload-artifact@v4
        with:
          name: lynx-web-bundle
          path: my-lynx-app/dist/
          retention-days: 7
          
