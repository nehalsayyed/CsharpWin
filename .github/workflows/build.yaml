name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Zig
        run: |
          wget https://ziglang.org/download/0.9.1/zig-linux-x86_64-0.9.1.tar.xz
          tar -xvf zig-linux-x86_64-0.9.1.tar.xz
          echo "$PWD/zig-linux-x86_64-0.9.1" >> $GITHUB_PATH

      - name: Install QEMU & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools --fix-missing

      - name: Check formatting
        run: zig fmt --check src

      - name: Build kernel
        run: zig build

      - name: Run unit tests
        run: zig build test

      - name: Run runtime test - Initialisation
        run: zig build rt-test -Ddisable-display -Dnographic -Dtest-mode=Initialisation

      - name: Run runtime test - Panic
        run: zig build rt-test -Ddisable-display -Dnographic -Dtest-mode=Panic

      - name: Run runtime test - Scheduler
        run: zig build rt-test -Ddisable-display -Dnographic -Dtest-mode=Scheduler

      - name: Run runtime test - Memory
        run: zig build rt-test -Ddisable-display -Dnographic -Dtest-mode=Memory
        
