name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate App & Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Set Global JVM & Memory Limits for Gradle (Fixes Java heap space error)
      - name: Configure JVM & Memory Settings
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.caching=false
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      # 6. Create valid project configuration files
      - name: Create Configuration Files
        run: |
          cat << 'EOF' > package.json
          {
            "name": "csharpwin",
            "version": "1.0.0",
            "main": "index.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android"
            },
            "dependencies": {
              "expo": "~51.0.0",
              "expo-device": "~6.0.2",
              "expo-status-bar": "~1.12.1",
              "react": "18.2.0",
              "react-native": "0.74.5"
            }
          }
          EOF

          cat << 'EOF' > app.json
          {
            "expo": {
              "name": "CsharpWin",
              "slug": "csharpwin",
              "version": "1.0.0",
              "orientation": "portrait",
              "userInterfaceStyle": "light",
              "newArchEnabled": false,
              "android": {
                "package": "com.csharpwin.app"
              }
            }
          }
          EOF

      # 7. Create App.js and Entry Point (index.js)
      - name: Write Source Code
        run: |
          cat << 'EOF' > App.js
          import { Text, View } from 'react-native';
          import * as Device from 'expo-device';

          export default function App() {
            return (
              <View style={{ flex: 1, justifyContent: 'center', alignItems: 'center' }}>
                <Text>
                  {Device.manufacturer}: {Device.modelName}
                </Text>
              </View>
            );
          }
          EOF

          cat << 'EOF' > index.js
          import { registerRootComponent } from 'expo';
          import App from './App';

          registerRootComponent(App);
          EOF

      # 8. Install exact dependencies
      - name: Install NPM Dependencies
        run: npm install

      # 9. Generate Android native folder using Expo Prebuild
      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean

      # 10. Make Gradle Executable
      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      # 11. Compile APK via Gradle
      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 12. Upload downloadable APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
