name: Build RISC-V Kernel for TinyEMU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout host repository
        uses: actions/checkout@v4

      - name: Install LLVM, Clang, LLD, and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm build-essential

      - name: Clone xeome/riscv-kernel repository
        run: |
          git clone https://github.com/xeome/riscv-kernel.git
          cd riscv-kernel

      - name: Compile RISC-V Kernel
        run: |
          cd riscv-kernel
          make

      - name: Verify compiled kernel binary
        run: |
          cd riscv-kernel
          ls -la
          # Assuming the output binary is kernel.elf or kernel.bin
          file kernel.elf || file kernel.bin || true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscv-kernel-binaries
          path: |
            riscv-kernel/kernel.elf
            riscv-kernel/kernel.bin
          if-no-files-found: warn
          
