name: Build Compact Termux PRoot RE Environment

on:
  workflow_dispatch:

jobs:
  build-arm64-ubuntu-min:
    name: Build Compact Ubuntu ARM64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Create Custom Ubuntu Rootfs via Docker
        run: |
          CONTAINER_ID=$(docker create --platform linux/arm64 ubuntu:24.04 bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            
            apt-get update
            apt-get install -y --no-install-recommends \
              python3 python3-pip python3-dev build-essential libffi-dev \
              radare2 git wget curl unzip openjdk-17-jre-headless \
              apktool aapt zipalign apksigner adb \
              zlib1g-dev libcapstone-dev libzip-dev liblz4-dev

            # Install Frida and Objection
            pip3 install --break-system-packages --no-cache-dir frida-tools objection

            # Strip unnecessary files to reduce rootfs size
            apt-get clean
            rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /usr/share/doc /usr/share/man
          ")

          docker start -a -i $CONTAINER_ID

          mkdir -p output
          docker export $CONTAINER_ID | xz -9 -T0 > output/ubuntu-arm64-re-compact.tar.xz

      - name: Upload Compact PRoot Image
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-arm64-re-compact-rootfs
          path: output/ubuntu-arm64-re-compact.tar.xz
          if-no-files-found: error
          
