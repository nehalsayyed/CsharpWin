name: Build JAX & jaxlib for Termux (Bionic libc)

on:
  workflow_dispatch:

jobs:
  build-jax:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Build JAX and jaxlib inside Termux Container
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            termux/termux-docker:aarch64 bash -c "
            set -e

            echo '=== Updating Packages & Enabling TUR ==='
            pkg update -y
            pkg install -y tur-repo

            echo '=== Installing Dependencies & Native Bazel ==='
            pkg update -y
            pkg install -y git cmake ninja clang lld python python-pip numpy bazel zlib libandroid-execinfo

            pip install build wheel setuptools

            echo '=== Locating Installed Bazel ==='
            BAZEL_BIN=$(which bazel || which bazel5 || which bazel7 || true)
            echo \"Found Bazel at: $BAZEL_BIN\"

            echo '=== Cloning JAX ==='
            git clone --recursive https://github.com/jax-ml/jax.git
            cd jax

            echo '=== Building jaxlib Wheel ==='
            python build/build.py build --wheels=jaxlib --bazel_path=$BAZEL_BIN --verbose

            echo '=== Building jax Wheel ==='
            python -m build --wheel --no-isolation

            echo '=== Packaging Artifacts ==='
            mkdir -p /tmp/jax-dist
            cp dist/*.whl /tmp/jax-dist/
            cp build/dist/*.whl /tmp/jax-dist/ || true
          "

      - name: Extract Wheels from Container
        run: |
          CONTAINER_ID=$(docker create termux/termux-docker:aarch64)
          docker cp $CONTAINER_ID:/tmp/jax-dist ./jax-wheels || true

      - name: Upload JAX Wheels
        uses: actions/upload-artifact@v4
        with:
          name: jax-termux-bionic-arm64
          path: jax-wheels/*.whl
          retention-days: 14
          
