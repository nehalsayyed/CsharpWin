name: Build Termux Android Wheel from Upstream

on:
  workflow_dispatch:

jobs:
  build-android-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate Android NDK
        id: setup-ndk
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk-bundle" ]; then
            NDK_PATH="$ANDROID_SDK_ROOT/ndk-bundle"
          else
            echo "Installing Android NDK..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          fi
          echo "ndk-path=$NDK_PATH" >> $GITHUB_OUTPUT

      - name: Clone llama-cpp-python Repository
        run: |
          git clone --recursive https://github.com/abetlen/llama-cpp-python.git upstream-repo

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build scikit-build-core cmake ninja

      - name: Build Wheel for Android (aarch64)
        working-directory: upstream-repo
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          
          # Explicit CMake toolchain flags for Android
          SKBUILD_CMAKE_ARGS: >-
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
            -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM=android-24
            -DANDROID_STL=c++_shared
            -DGGML_NATIVE=OFF
            -DGGML_OPENMP=OFF
            -DGGML_LLAMAFILE=OFF
            -DBUILD_SHARED_LIBS=ON
            
          # Target platform override for pip
          _PYTHON_HOST_PLATFORM: linux-aarch64

        run: |
          mkdir -p ../dist
          python -m pip wheel . --no-deps -w ../dist/

      - name: Upload Plug-and-Play Wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-termux-aarch64-wheel
          path: dist/*.whl
          
