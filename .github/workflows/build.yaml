name: Package noVNC Release

on:
  workflow_dispatch:

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout noVNC Repository
        uses: actions/checkout@v4
        with:
          repository: novnc/noVNC
          ref: master
          path: novnc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Package Static App
        run: |
          cd novnc
          npm ci
          npm run build --if-present
          
          # Clean non-production development overhead
          rm -rf node_modules .git .github tests po docs
          
          # Create single output archive
          cd ..
          zip -r novnc-static-app.zip novnc/

      - name: Upload Static App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: novnc-static-app
          path: novnc-static-app.zip
          retention-days: 7
          
