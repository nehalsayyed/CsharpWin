name: Build Compact Termux PRoot RE Environment

on:
  workflow_dispatch:

jobs:
  build-arm64-alpine:
    name: Build Alpine ARM64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Create Custom Alpine Rootfs via Docker
        run: |
          CONTAINER_ID=$(docker create --platform linux/arm64 alpine:latest sh -c "
            apk update && apk add --no-cache \
              python3 py3-pip python3-dev build-base libffi-dev \
              radare2 git wget curl unzip openjdk17-jre-headless \
              apktool aapt zipalign apksigner adb \
              zlib-dev capstone-dev libzip-dev lz4-dev

            # Install Frida and Objection
            pip3 install --break-system-packages --no-cache-dir frida-tools objection
            
            # Clear temporary caches
            rm -rf /root/.cache /var/cache/apk/*
          ")

          docker start -a -i $CONTAINER_ID

          mkdir -p output
          docker export $CONTAINER_ID | xz -9 -T0 > output/alpine-arm64-re.tar.xz

      - name: Upload Compact PRoot Image
        uses: actions/upload-artifact@v4
        with:
          name: alpine-arm64-re-rootfs
          path: output/alpine-arm64-re.tar.xz
          if-no-files-found: error
          
