name: Build

on: 
   workflow_dispatch:

jobs:
   build:
    runs-on: ubuntu-latest
    steps:
       
       
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21' # Replace with your required Java version (e.g., 8, 11, 17, 21)
    
       
       
    - run: |
          git clone https://github.com/apache/fineract.git
          cd fineract
          chmod 777 gradlew 
          ls
          ./gradlew clean bootJar
          ls
