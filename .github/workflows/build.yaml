name: Build Custom JRE for Termux

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-termux-jre:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK on Runner
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Download an Android/Linux-aarch64 JDK build to extract modules from
      - name: Download Termux-compatible OpenJDK
        run: |
          mkdir -p target-jdk
          # Using Eclipse Temurin / Adoptium Linux AArch64 (ARM64) binary
          curl -L -o openjdk.tar.gz https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.2_13.tar.gz
          tar -xzf openjdk.tar.gz -C target-jdk --strip-components=1

      - name: Build Custom Lightweight JRE with jlink
        run: |
          # Define only the modules your application/script actually needs
          MODULES="java.base,java.logging,java.sql,java.net.http"
          
          # Run jlink using host JDK targeting the downloaded AArch64 modules
          $JAVA_HOME/bin/jlink \
            --module-path target-jdk/jmods \
            --add-modules $MODULES \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=zip-9 \
            --output custom-jre-aarch64

      - name: Package JRE Tarball
        run: |
          tar -czvf termux-jre-aarch64.tar.gz custom-jre-aarch64/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-jre-aarch64
          path: termux-jre-aarch64.tar.gz
          
