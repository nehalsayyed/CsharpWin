name: Build Obfuscated Capacitor APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Obfuscate Capacitor App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # =======================================================
      # STEP 1: Scaffolding New Capacitor Project & Dependencies
      # =======================================================
      - name: Initialize Capacitor App & Tools
        run: |
          mkdir -p my-app
          cd my-app
          
          # Initialize package.json
          npm init -y
          
          # Install Capacitor Core, CLI, Android Platform, and JS Obfuscator
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D javascript-obfuscator
          
          # Initialize Capacitor configuration
          npx cap init "SecureApp" "com.example.secureapp" --web-dir "dist"

      # =======================================================
      # STEP 2: Create Web App & Apply Web Obfuscation
      # =======================================================
      - name: Create Web Assets & Obfuscate JS/HTML
        run: |
          cd my-app
          mkdir -p dist
          
          # Create source JS file
          cat << 'EOF' > dist/app.js
          (function() {
              const apiSecretKey = "SUPER_SECRET_API_TOKEN_12345";
              console.log("App initialized securely.");
              document.addEventListener("DOMContentLoaded", () => {
                  document.getElementById("status").innerText = "Obfuscated App Running!";
              });
          })();
          EOF

          # Create HTML file
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Secure App</title>
              <script src="app.js"></script>
          </head>
          <body>
              <h1>Secure Capacitor App</h1>
              <p id="status">Loading...</p>
          </body>
          </html>
          EOF

          # Obfuscate JavaScript web bundle
          npx javascript-obfuscator ./dist/app.js --output ./dist/app.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 1 \
            --dead-code-injection true \
            --dead-code-injection-threshold 1 \
            --string-array true \
            --string-array-encoding 'base64' \
            --string-array-threshold 1 \
            --split-strings true

      # =======================================================
      # STEP 3: Add Android Platform & Inject Correct Configurations
      # =======================================================
      - name: Add Android Platform & Setup R8 + Dependency Overrides
        run: |
          cd my-app
          
          # Add Android target and sync web assets
          npx cap add android
          npx cap sync android

          # 1. FIX: Inject Kotlin stdlib resolution strategy into root build.gradle safely
          python3 -c '
          path = "android/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          
          resolution_rule = """
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          if (details.requested.name == "kotlin-stdlib-jdk7" || details.requested.name == "kotlin-stdlib-jdk8") {
                              details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:" + details.requested.version)
                          }
                      }
                  }
              }
          }
          """
          with open(path, "w") as f:
              f.write(content + "\n" + resolution_rule)
          '

          # 2. FIX: Safely enable R8 obfuscation in app/build.gradle without breaking resource shrinking
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          
          # Ensure release buildType enables minification properly
          content = content.replace("minifyEnabled false", "minifyEnabled true")
          content = content.replace("shrinkResources false", "shrinkResources false") # Kept false to avoid R8 un-referenced resource stripping errors on dynamic WebViews
          
          with open(path, "w") as f:
              f.write(content)
          '

          # 3. FIX: Write accurate, valid ProGuard/R8 rules
          PROGUARD_RULES="android/app/proguard-rules.pro"
          cat << 'EOF' > $PROGUARD_RULES
          # R8 Attribute Keep Rules
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod

          # Preserve essential Capacitor Native Bridge reflection methods
          -keep public class com.getcapacitor.** { *; }
          -keep class * extends com.getcapacitor.Plugin { *; }
          -keep class * extends com.getcapacitor.Bridge { *; }
          -keepclassmembers class * {
              @com.getcapacitor.PluginMethod <methods>;
              @android.webkit.JavascriptInterface <methods>;
          }

          # Suppress web view internal warnings during R8 optimization
          -dontwarn android.webkit.**
          -dontwarn com.getcapacitor.**
          EOF

      # =======================================================
      # STEP 4: Build Native Android APK
      # =======================================================
      - name: Build Obfuscated Release APK
        run: |
          cd my-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # =======================================================
      # STEP 5: Upload Artifact
      # =======================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obfuscated-capacitor-app
          path: my-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          
