name: Build Fully Static GraalVM Native Binary for Termux

on:
  workflow_dispatch: # Manual trigger from GitHub Actions UI
  

jobs:
  build-static-binary:
    # Use native ARM64 runner for fast aarch64 compilation
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Install Musl C Library and development tools
      - name: Install Musl Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl musl-dev musl-tools

      # Step 2: Set up GraalVM JDK with Musl support enabled
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-musl-native-toolchain: 'true'

      # Step 3: Create a sample Java application if src doesn't exist
      - name: Init Example Java Project
        run: |
          mkdir -p src/com/example
          cat << 'EOF' > src/com/example/Main.java
          package com.example;

          public class Main {
              public static void main(String[] args) {
                  System.out.println("==========================================");
                  System.out.println(" Hello from Static GraalVM on Termux!     ");
                  System.out.println(" Architecture: " + System.getProperty("os.arch"));
                  System.out.println(" Java Version: " + System.getProperty("java.version"));
                  System.out.println("==========================================");
              }
          }
          EOF

      # Step 4: Compile Java source code to bytecode
      - name: Compile Java Code
        run: |
          mkdir -p bin
          javac -d bin src/com/example/Main.java

      # Step 5: Build fully static native binary with Musl
      - name: Build Fully Static Native Executable
        run: |
          native-image \
            -cp bin \
            --no-fallback \
            --static \
            --libc=musl \
            -H:Name=app-aarch64 \
            com.example.Main

      # Step 6: Verify the binary details
      - name: Verify Binary Info
        run: |
          chmod +x app-aarch64
          file app-aarch64

      # Step 7: Upload binary artifact
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-static-app-aarch64
          path: app-aarch64
          
