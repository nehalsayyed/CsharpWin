name: Build PhoneInfoga arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Clone Repository
        run: |
          git clone https://github.com/sundowndev/phoneinfoga.git

      - name: Build Web Client (Frontend)
        run: |
          cd phoneinfoga/web/client
          npm install
          npm run build

      - name: Build Standalone ARM64 Binary
        run: |
          cd phoneinfoga
          
          # Cross-compile static standalone binary for Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o phoneinfoga-linux-arm64 .
          
          file phoneinfoga-linux-arm64

      - name: Upload arm64 Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneinfoga-linux-arm64
          path: phoneinfoga/phoneinfoga-linux-arm64
          
