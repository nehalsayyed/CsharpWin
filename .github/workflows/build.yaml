name: Build Codon via QEMU ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Set up QEMU Emulation for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Run Build inside Native ARM64 Container
        run: |
          docker run --rm --platform linux/arm64 ubuntu:22.04 bash -c "
            set -e
            apt-get update && apt-get install -y git cmake ninja-build clang lld gcc gfortran libgc-dev tar

            echo '=== Cling Codon Source ==='
            git clone --recursive https://github.com/exaloop/codon.git
            cd codon

            echo '=== Building Codon Custom LLVM ==='
            git clone --depth 1 -b codon https://github.com/exaloop/llvm-project
            cmake -S llvm-project/llvm -B llvm-project/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_INCLUDE_TESTS=OFF \
              -DLLVM_ENABLE_RTTI=ON \
              -DLLVM_ENABLE_PROJECTS='openmp' \
              -DLLVM_TARGETS_TO_BUILD='AArch64'
            cmake --build llvm-project/build --parallel \$(nproc)

            echo '=== Building Codon ==='
            export CODON_SYSTEM_LIBRARIES=/usr/lib/aarch64-linux-gnu
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_DIR=\$(pwd)/llvm-project/build/lib/cmake/llvm \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCODON_PYTHON=OFF
            cmake --build build --config Release --parallel \$(nproc)

            echo '=== Packaging Artifacts ==='
            mkdir -p /tmp/dist/bin /tmp/dist/lib
            cp build/codon /tmp/dist/bin/
            if [ -d 'stdlib' ]; then cp -r stdlib /tmp/dist/lib/codon; fi
            tar -czvf /tmp/codon-termux-arm64.tar.gz -C /tmp/dist .
          "

      - name: Extract Build Output
        run: |
          CONTAINER_ID=$(docker create --platform linux/arm64 ubuntu:22.04)
          docker cp $CONTAINER_ID:/tmp/codon-termux-arm64.tar.gz ./codon-termux-arm64.tar.gz || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codon-termux-arm64
          path: codon-termux-arm64.tar.gz
          retention-days: 14
          
