name: Build Termux Android Wheel from Upstream

on:
  workflow_dispatch:

jobs:
  build-android-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android NDK
        id: setup-ndk
        uses: nszin/setup-android-ndk@v1
        with:
          ndk-version: r26b

      - name: Clone llama-cpp-python Repository
        run: |
          git clone --recursive https://github.com/abetlen/llama-cpp-python.git upstream-repo

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build scikit-build-core

      - name: Build Wheel for Android (aarch64)
        cwd: upstream-repo
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          
          # Pass CMake parameters for Android cross-compilation
          SKBUILD_CMAKE_ARGS: >-
            -DCMAKE_SYSTEM_NAME=Android
            -DCMAKE_SYSTEM_VERSION=24
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a
            -DCMAKE_ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}
            -DCMAKE_ANDROID_STL_TYPE=c++_shared
            -DGGML_NATIVE=OFF
            -DGGML_OPENMP=OFF
            -DGGML_LLAMAFILE=OFF
            
          # Target platform tag override
          _PYTHON_HOST_PLATFORM: linux-aarch64

        run: |
          mkdir -p ../dist
          python -m pip wheel . --no-deps -w ../dist/

      - name: Upload Plug-and-Play Wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-termux-aarch64-wheel
          path: dist/*.whl
          
