name: Build

on: 
   workflow_dispatch:

jobs:
   build:
    runs-on: ubuntu-latest
    steps:
       
       
    - name: Set up Java
      uses: actions/setup-go@v7
      
       
       
    - run: |
          git clone  https://github.com/tinygo-org/tinygo.git
          cd tinygo
          go build
