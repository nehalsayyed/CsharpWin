name: Fast Codon Build (Native ARM64 + Termux)

on:
  workflow_dispatch:

jobs:
  build-bionic:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Build directly inside Native Termux Environment
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            termux/termux-docker:aarch64 bash -c "
            set -e

            echo '=== Updating & Installing Dependencies ==='
            pkg update -y
            pkg install -y git cmake ninja clang lld zlib libgc python fastfetch

            fastfetch

            echo '=== Cloning Codon ==='
            git clone --recursive https://github.com/exaloop/codon.git
            cd codon

            echo '=== Building Custom LLVM ==='
            git clone --depth 1 -b codon https://github.com/exaloop/llvm-project
            cmake -S llvm-project/llvm -B llvm-project/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_INCLUDE_TESTS=OFF \
              -DLLVM_ENABLE_RTTI=ON \
              -DLLVM_ENABLE_PROJECTS='openmp' \
              -DLLVM_TARGETS_TO_BUILD='AArch64'
            cmake --build llvm-project/build --parallel \$(nproc)

            echo '=== Configuring Codon for Bionic ==='
            export CODON_SYSTEM_LIBRARIES=\$PREFIX/lib
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_DIR=\$(pwd)/llvm-project/build/lib/cmake/llvm \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCODON_PYTHON=OFF
            cmake --build build --config Release --parallel \$(nproc)

            echo '=== Packaging Artifacts ==='
            mkdir -p /tmp/dist/bin /tmp/dist/lib
            cp build/codon /tmp/dist/bin/
            if [ -d 'stdlib' ]; then cp -r stdlib /tmp/dist/lib/codon; fi
            tar -czvf /tmp/codon-termux-bionic.tar.gz -C /tmp/dist .
          "

      - name: Extract Compiled Binary
        run: |
          CONTAINER_ID=$(docker create termux/termux-docker:aarch64)
          docker cp $CONTAINER_ID:/tmp/codon-termux-bionic.tar.gz ./codon-termux-bionic.tar.gz || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codon-termux-bionic-arm64
          path: codon-termux-bionic.tar.gz
          retention-days: 14
          
