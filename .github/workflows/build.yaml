name: Build Yalantis Side-Menu AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the Yalantis repo and pull submodules (CircularReveal)
      - name: Clone Yalantis Repository
        run: |
          git clone --recursive https://github.com/Yalantis/Side-Menu.Android.git .

      # 2. Set up JDK 17 (Required by modern Ubuntu runners & SDK tools)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Build the AAR file
      - name: Build Library AAR
        run: |
          chmod +x gradlew
          ./gradlew :library:assembleRelease --stacktrace

      # 4. Upload the compiled .aar artifact
      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidemenu-release
          path: "library/build/outputs/aar/*.aar"
          
