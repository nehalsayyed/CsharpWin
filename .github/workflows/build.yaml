name: Build Yalantis Side-Menu AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the Yalantis repo and pull submodules (CircularReveal)
      - name: Clone Yalantis Repository
        run: |
          git clone --recursive https://github.com/Yalantis/Side-Menu.Android.git .

      # 2. Set up JDK 8 (Required for older 6+ year Gradle builds)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      # 3. Accept Android SDK Licenses
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 4. Build the AAR file using legacy Gradle wrapper
      - name: Build Library AAR
        run: |
          chmod +x gradlew
          ./gradlew :library:assembleRelease --stacktrace

      # 5. Upload the compiled .aar artifact
      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidemenu-release
          path: "library/build/outputs/aar/*.aar"
          
