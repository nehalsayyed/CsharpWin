name: Build Termux PRoot RE Environment

on:
  workflow_dispatch:

jobs:
  build-arm64-rootfs:
    name: Build ARM64 Ubuntu PRoot Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Create Custom Ubuntu Rootfs via Docker
        run: |
          CONTAINER_ID=$(docker create --platform linux/arm64 ubuntu:24.04 bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt update && apt upgrade -y
            
            # Install base tools, Python, Java, and Android SDK utilities
            apt install -y \
              python3 python3-pip python3-dev build-essential libffi-dev \
              radare2 git wget curl unzip openjdk-17-jre-headless \
              zlib1g-dev libcapstone-dev libzip-dev liblz4-dev \
              apktool aapt zipalign apksigner adb
            
            # Install Frida and Objection via pip
            pip3 install --break-system-packages frida-tools objection
            
            # Clean up apt caches to keep the rootfs size minimal
            apt clean
            rm -rf /var/lib/apt/lists/*
          ")

          docker start -a -i $CONTAINER_ID

          mkdir -p output
          docker export $CONTAINER_ID | xz -9 -T0 > output/ubuntu-arm64-re.tar.xz

      - name: Upload PRoot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-arm64-re-rootfs
          path: output/ubuntu-arm64-re.tar.xz
          if-no-files-found: error
          
