name: Build Obfuscated Capacitor APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Obfuscate Capacitor App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # =======================================================
      # STEP 1: Scaffolding New Capacitor Project & Dependencies
      # =======================================================
      - name: Initialize Capacitor App & Tools
        run: |
          mkdir -p my-app
          cd my-app
          
          # Initialize package.json
          npm init -y
          
          # Install Capacitor Core, CLI, Android Platform, and JS Obfuscator
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D javascript-obfuscator
          
          # Initialize Capacitor configuration
          npx cap init "SecureApp" "com.example.secureapp" --web-dir "dist"

      # =======================================================
      # STEP 2: Create Web App & Apply Web Obfuscation
      # =======================================================
      - name: Create Web Assets & Obfuscate JS/HTML
        run: |
          cd my-app
          mkdir -p dist
          
          # Create sensitive source JS file
          cat << 'EOF' > dist/app.js
          (function() {
              const apiSecretKey = "SUPER_SECRET_API_TOKEN_12345";
              console.log("App initialized securely.");
              document.addEventListener("DOMContentLoaded", () => {
                  document.getElementById("status").innerText = "Obfuscated App Running!";
              });
          })();
          EOF

          # Create HTML file
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Secure App</title>
              <script src="app.js"></script>
          </head>
          <body>
              <h1>Secure Capacitor App</h1>
              <p id="status">Loading...</p>
          </body>
          </html>
          EOF

          # Obfuscate JavaScript web bundle thoroughly
          npx javascript-obfuscator ./dist/app.js --output ./dist/app.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 1 \
            --dead-code-injection true \
            --dead-code-injection-threshold 1 \
            --string-array true \
            --string-array-encoding 'base64' \
            --string-array-threshold 1 \
            --split-strings true

      # =======================================================
      # STEP 3: Generate Android Platform & Configure ProGuard + Fix Duplicates
      # =======================================================
      - name: Add Android Platform & Resolve Dependencies
        run: |
          cd my-app
          
          # Add Android target and sync web assets
          npx cap add android
          npx cap sync android

          # FIX: Inject Resolution Strategy into root build.gradle to prevent duplicate Kotlin stdlib classes
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      def requested = details.requested
                      if (requested.group == 'org.jetbrains.kotlin') {
                          if (requested.name == 'kotlin-stdlib-jdk7' || requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${requested.version}"
                          }
                      }
                  }
              }
          }
          EOF

          # Enable Minification (R8/ProGuard Obfuscation) in Gradle
          BUILD_GRADLE="android/app/build.gradle"
          sed -i 's/minifyEnabled false/minifyEnabled true/g' $BUILD_GRADLE
          sed -i 's/shrinkResources false/shrinkResources true/g' $BUILD_GRADLE

          # Add aggressive ProGuard rules for native Java/Kotlin code
          PROGUARD_RULES="android/app/proguard-rules.pro"
          cat << 'EOF' >> $PROGUARD_RULES
          # Rename classes, fields, and methods aggressively
          -repackageclasses ''
          -allowaccessmodification
          -attributes *Annotation*
          
          # Preserve essential Capacitor bridge components
          -keep public class com.getcapacitor.** { *; }
          -keep public class * extends com.getcapacitor.Plugin
          EOF

      # =======================================================
      # STEP 4: Build Native Android APK
      # =======================================================
      - name: Build Obfuscated Release APK
        run: |
          cd my-app/android
          chmod +x gradlew
          ./gradlew assembleRelease

      # =======================================================
      # STEP 5: Upload Artifact
      # =======================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obfuscated-capacitor-app
          path: my-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          
