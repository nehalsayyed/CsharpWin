name: SPARK Ada Verification

on:
  workflow_dispatch:

jobs:
  verify:
    name: Run SPARK Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Alire Package Manager
        run: |
          wget https://github.com/alire-project/alire/releases/download/v2.0.1/alr-2.0.1-bin-x86_64-linux.zip
          unzip alr-2.0.1-bin-x86_64-linux.zip -d alire_bin
          echo "$PWD/alire_bin/bin" >> $GITHUB_PATH

      - name: Create Inline Ada/SPARK Project
        run: |
          mkdir -p ada_demo/src
          
          cat << 'EOF' > ada_demo/ada_demo.gpr
          project Ada_Demo is
             for Source_Dirs use ("src");
             for Object_Dir use "obj";
             for Main use ("main.adb");
          end Ada_Demo;
          EOF

          cat << 'EOF' > ada_demo/src/math_ops.ads
          package Math_Ops with SPARK_Mode => On is
             subtype Bounded_Int is Integer range 0 .. 1000;
             
             function Add (A, B : Bounded_Int) return Integer
               with Post => Add'Result = A + B;
          end Math_Ops;
          EOF

          cat << 'EOF' > ada_demo/src/math_ops.adb
          package body Math_Ops with SPARK_Mode => On is
             function Add (A, B : Bounded_Int) return Integer is
             begin
                return A + B;
             end Add;
          end Math_Ops;
          EOF

          cat << 'EOF' > ada_demo/src/main.adb
          with Math_Ops;
          procedure Main is
             Result : Integer;
          begin
             Result := Math_Ops.Add (10, 20);
          end Main;
          EOF

      - name: Provision GNAT Compiler
        working-directory: ./ada_demo
        run: |
          alr --non-interactive toolchain --select gnat_native

      - name: Install GNATprove Crate
        working-directory: ./ada_demo
        run: |
          alr --non-interactive with gnatprove

      - name: Run SPARK Prover (GNATprove)
        working-directory: ./ada_demo
        run: alr exec -- gnatprove -P ada_demo.gpr --level=1 --report=all
        
