name: Build

on:
  workflow_dispatch:

jobs:
  build-mac:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clone target repository
        run: git clone --recursive https://github.com/andreabergia/rjvm.git

      - name: Build and Run RJVM
        run: |
          cd rjvm
          cargo run --release
