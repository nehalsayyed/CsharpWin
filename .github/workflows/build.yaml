name: Build

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build
    runs-on: ubuntu-latest
    container: rust:latest

    steps:
        

      - name: Run
        run: |
            apt update -y
            apt install git -y
            git clone --recursive https://github.com/andreabergia/rjvm.git
            cd rjvm
            cargo run --release
        
             
      
    
