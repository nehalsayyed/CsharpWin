name: Build 600MB Fully-Offline Flutter APK RootFS (Native ARM64)

on:
  workflow_dispatch:
  

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Alpine-Based Offline RootFS
        run: |
          set -e

          # Install host dependencies
          sudo apt-get update
          sudo apt-get install -y tar xz-utils curl

          ROOTFS_DIR="$(pwd)/alpine-rootfs"
          mkdir -p "$ROOTFS_DIR"

          echo "==> Downloading Alpine Linux 3.24.1 ARM64 Mini RootFS..."
          curl -sSLf "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-minirootfs-3.24.1-aarch64.tar.gz" -o alpine-rootfs.tar.gz

          echo "==> Extracting Alpine RootFS..."
          tar -xzf alpine-rootfs.tar.gz -C "$ROOTFS_DIR"
          rm alpine-rootfs.tar.gz

          echo "==> Setting up Chroot mounts..."
          sudo mount --bind /dev "$ROOTFS_DIR/dev"
          sudo mount --bind /proc "$ROOTFS_DIR/proc"
          sudo mount --bind /sys "$ROOTFS_DIR/sys"
          echo "nameserver 8.8.8.8" | sudo tee "$ROOTFS_DIR/etc/resolv.conf"

          echo "==> Configuring and Packing Environment inside Chroot..."
          sudo chroot "$ROOTFS_DIR" /bin/sh -c "
            set -e

            # Enable main and community repositories for Alpine 3.24
            echo 'https://dl-cdn.alpinelinux.org/alpine/v3.24/main' > /etc/apk/repositories
            echo 'https://dl-cdn.alpinelinux.org/alpine/v3.24/community' >> /etc/apk/repositories

            apk update
            apk add --no-cache \
              bash curl git unzip xz libstdc++ gcompat \
              openjdk17-jdk ca-certificates shadow sudo

            # Fix glibc shared library paths for Dart/Flutter engine execution on Alpine
            mkdir -p /lib64
            ln -sf /lib/libc.musl-aarch64.so.1 /lib64/ld-linux-aarch64.so.1 || true

            # Install Flutter SDK into /opt
            mkdir -p /opt
            cd /opt
            curl -sSLf https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_arm64_stable.tar.xz | tar -xJ

            # Setup Android SDK structure
            export ANDROID_SDK_ROOT=/opt/android-sdk
            mkdir -p \$ANDROID_SDK_ROOT/cmdline-tools
            cd \$ANDROID_SDK_ROOT/cmdline-tools
            curl -sSLf https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
            unzip -q cmdline.zip
            mv cmdline-tools latest
            rm cmdline.zip

            # Global Environment Profile configuration
            cat << 'EOF' > /etc/profile.d/flutter.sh
            export PATH=\"/opt/flutter/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:\$PATH\"
            export ANDROID_SDK_ROOT=\"/opt/android-sdk\"
            export ANDROID_HOME=\"/opt/android-sdk\"
            export JAVA_HOME=\"/usr/lib/jvm/java-17-openjdk\"
            export LANG=\"C.UTF-8\"
            EOF
            chmod +x /etc/profile.d/flutter.sh

            # Create developer non-root user
            useradd -m -s /bin/bash developer
            echo 'developer ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
            chown -R developer:developer /opt/flutter /opt/android-sdk

            # Pre-download Android SDK platforms & Flutter artifacts inside runner
            git config --global --add safe.directory /opt/flutter
            su - developer -s /bin/bash -c \"
              source /etc/profile.d/flutter.sh

              # Accept licenses & download build dependencies
              yes | sdkmanager --sdk_root=\$ANDROID_SDK_ROOT \
                'platform-tools' \
                'platforms;android-34' \
                'build-tools;34.0.0'

              # Precache Flutter Android engine dependencies
              flutter config --no-analytics
              flutter config --android-sdk \$ANDROID_SDK_ROOT
              flutter precache --android --no-web --no-linux --no-windows --no-fuchsia
            \"

            # Cleanup caches to preserve target size
            rm -rf /var/cache/apk/*
            rm -rf /tmp/* /var/tmp/*
            rm -rf /opt/flutter/bin/cache/downloads/*
            rm -rf /opt/flutter/docs /opt/flutter/examples
            rm -rf /root/.cache /home/developer/.cache
          "

          echo "==> Unmounting system mounts..."
          sudo umount "$ROOTFS_DIR/dev"
          sudo umount "$ROOTFS_DIR/proc"
          sudo umount "$ROOTFS_DIR/sys"

          echo "==> Compressing into high-ratio tarball..."
          XZ_OPT="-8e -T0" sudo tar --exclude='./dev/*' --exclude='./proc/*' --exclude='./sys/*' \
            -cJf "offline-flutter-apk-arm64.tar.xz" -C "$ROOTFS_DIR" .

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-flutter-apk-arm64
          path: offline-flutter-apk-arm64.tar.xz
          
