name: Build Fully-Offline Flutter APK Toolchain (Native ARM64)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip xz-utils curl git

      - name: Download & Install Flutter and Android SDK
        run: |
          set -e
          sudo mkdir -p /opt/flutter /opt/android-sdk
          sudo chown -R $USER:$USER /opt/flutter /opt/android-sdk

          echo "==> Cloning Flutter SDK..."
          git clone -b stable --depth 1 https://github.com/flutter/flutter.git /opt/flutter

          echo "==> Downloading Android Command-Line Tools..."
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk/cmdline-tools
          
          curl -sSLf "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          rm cmdline.zip

      - name: Accept Licenses & Pre-cache All Offline Engine & Android Dependencies
        run: |
          set -e
          export PATH="/opt/flutter/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:$PATH"
          export ANDROID_SDK_ROOT="/opt/android-sdk"
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-arm64"

          echo "==> Installing Android SDK packages via sdkmanager..."
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "==> Precaching Flutter Engine Artifacts..."
          flutter config --no-analytics
          flutter config --android-sdk $ANDROID_SDK_ROOT
          flutter precache --android --no-web --no-linux --no-windows --no-fuchsia

          echo "==> Creating dummy Flutter app..."
          mkdir -p /tmp/dummy_app
          cd /tmp/dummy_app
          flutter create --template=app .

          echo "==> Forcing Native ARM64 AAPT2 via Gradle properties..."
          cat << 'EOF' >> android/gradle.properties
          android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/34.0.0/aapt2
          EOF

          echo "==> Pre-building APK to warm up offline cache..."
          flutter build apk --debug
          cd /
          rm -rf /tmp/dummy_app

      - name: Compress Environment into High-Ratio Offline Archive
        run: |
          set -e
          echo "==> Packaging SDKs and Gradle cache..."
          XZ_OPT="-8e -T0" tar -cJf offline-flutter-apk-arm64.tar.xz /opt/flutter /opt/android-sdk ~/.gradle

      - name: Upload RootFS/Toolchain Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-flutter-apk-arm64
          path: offline-flutter-apk-arm64.tar.xz
          retention-days: 7
          
