name: Build Fully-Offline Flutter APK Toolchain (Native ARM64)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Multi-Arch Support & x86_64 Emulation
        run: |
            sudo apt update -y
            sudo apt install cpu-checker -y
            sudo kvm-ok
