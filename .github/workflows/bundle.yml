name: Build 600MB Fully-Offline Flutter APK RootFS (Native ARM64)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build RootFS inside Alpine Container
        run: |
          set -e

          # Create work directory on runner
          BUILD_DIR="$(pwd)/build_rootfs"
          mkdir -p "$BUILD_DIR"

          # Execute full environment preparation inside an isolated Docker Alpine 3.24 container
          docker run --rm \
            --platform linux/arm64 \
            -v "$BUILD_DIR:/export" \
            alpine:3.24 /bin/sh -c "
            set -e

            echo '==> Updating Alpine Repositories...'
            echo 'https://dl-cdn.alpinelinux.org/alpine/v3.24/main' > /etc/apk/repositories
            echo 'https://dl-cdn.alpinelinux.org/alpine/v3.24/community' >> /etc/apk/repositories

            apk update
            apk add --no-cache \
              bash curl git unzip xz libstdc++ gcompat \
              openjdk17-jdk ca-certificates shadow sudo

            # Fix glibc shared library paths for Dart/Flutter binary runtimes
            mkdir -p /lib64
            ln -sf /lib/libc.musl-aarch64.so.1 /lib64/ld-linux-aarch64.so.1 || true

            # Clone Flutter SDK directly via git to guarantee no 404 archive errors
            echo '==> Fetching Flutter SDK via Git...'
            mkdir -p /opt
            git clone -b stable --depth 1 https://github.com/flutter/flutter.git /opt/flutter

            # Setup Android SDK structure using valid Google URL
            echo '==> Downloading Android Command-Line Tools...'
            export ANDROID_SDK_ROOT=/opt/android-sdk
            mkdir -p \$ANDROID_SDK_ROOT/cmdline-tools
            cd \$ANDROID_SDK_ROOT/cmdline-tools
            curl -sSLf https://dl.google.com/android/repository/commandlinetools-linux-12700392_latest.zip -o cmdline.zip
            unzip -q cmdline.zip
            mv cmdline-tools latest
            rm cmdline.zip

            # Global Environment Profile configuration
            cat << 'EOF' > /etc/profile.d/flutter.sh
            export PATH=\"/opt/flutter/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:\$PATH\"
            export ANDROID_SDK_ROOT=\"/opt/android-sdk\"
            export ANDROID_HOME=\"/opt/android-sdk\"
            export JAVA_HOME=\"/usr/lib/jvm/java-17-openjdk\"
            export LANG=\"C.UTF-8\"
            EOF
            chmod +x /etc/profile.d/flutter.sh

            # Create developer non-root user
            useradd -m -s /bin/bash developer
            echo 'developer ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
            chown -R developer:developer /opt/flutter /opt/android-sdk

            # Pre-download Android SDK platforms & Flutter engine artifacts
            git config --global --add safe.directory /opt/flutter
            su - developer -s /bin/bash -c \"
              source /etc/profile.d/flutter.sh

              # Accept licenses & download build dependencies
              yes | sdkmanager --sdk_root=\$ANDROID_SDK_ROOT \
                'platform-tools' \
                'platforms;android-34' \
                'build-tools;34.0.0'

              # Precache Flutter Android engine dependencies
              flutter config --no-analytics
              flutter config --android-sdk \$ANDROID_SDK_ROOT
              flutter precache --android --no-web --no-linux --no-windows --no-fuchsia
            \"

            # Cleanup build cache
            rm -rf /var/cache/apk/*
            rm -rf /tmp/* /var/tmp/*
            rm -rf /opt/flutter/bin/cache/downloads/*
            rm -rf /opt/flutter/docs /opt/flutter/examples
            rm -rf /root/.cache /home/developer/.cache

            echo '==> Copying root filesystem structure to export directory...'
            cp -rp /bin /etc /home /lib /lib64 /media /mnt /opt /root /run /sbin /srv /usr /var /export/
            mkdir -p /export/dev /export/proc /export/sys /export/tmp
            "

          echo "==> Compressing exported container filesystem into high-ratio xz archive..."
          sudo apt-get update && sudo apt-get install -y xz-utils
          XZ_OPT="-8e -T0" sudo tar -cJf "offline-flutter-apk-arm64.tar.xz" -C "$BUILD_DIR" .

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-flutter-apk-arm64
          path: offline-flutter-apk-arm64.tar.xz
          
